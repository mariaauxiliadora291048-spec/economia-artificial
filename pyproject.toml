[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "economia-artificial"
version = "0.1.0"
description = "Laboratório econômico fechado para agentes de IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "openai>=1.0",
]

[project.scripts]
economia-demo = "economia_artificial.demo:main"
economia-server = "economia_artificial.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.5,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/economia_artificial"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
